name: Refresh listing counts

# Every morning, save how many Toronto homes are for sale (by neighbourhood and home type) into
# src/data/listing-counts.json. The push makes Cloudflare rebuild, so every page shows today's numbers.
on:
  schedule:
    - cron: '15 11 * * *' # 7:15 am Toronto time in summer, 6:15 am in winter
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Fetch today's counts
        # The Pages project address works with or without the custom domain.
        run: curl -sSf --connect-timeout 20 --max-time 120 --retry 3 --retry-delay 20 https://kirbychan-toronto.pages.dev/api/listing-counts -o /tmp/counts.json

      - name: Place new listings on the map
        # Each call starts up to 1,000 address lookups in the background (the site caps a day at the
        # free quota), so new listings are on the map before visitors arrive. Never stops the counts.
        run: |
          for q in '' '' 'for=lease'; do
            curl -sS --max-time 120 -o /dev/null -w "map $q: %{http_code}\n" "https://kirbychan-toronto.pages.dev/api/map?$q" || true
            sleep 90
          done

      - name: Check the numbers look sane
        # A PropTx outage must not publish zeros across the site. Keep yesterday's file instead.
        run: |
          node -e "
            const c = require('/tmp/counts.json');
            if (!(c.toronto && c.toronto.total > 2000 && c.complete && Object.keys(c.areas).length >= 10)) {
              console.error('Counts look wrong, keeping the old file:', JSON.stringify(c).slice(0, 300));
              process.exit(1);
            }
          "
          cp /tmp/counts.json src/data/listing-counts.json

      - name: Commit if changed
        run: |
          git diff --quiet && { echo 'No change'; exit 0; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am 'Daily listing counts'
          git push
